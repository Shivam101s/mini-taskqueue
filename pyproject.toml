[project]
name = "mini-taskqueue"
version = "0.1.0"
description = "A small, dependency-free distributed task queue backed by SQLite"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
taskqueue = "taskqueue.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["taskqueue"]
